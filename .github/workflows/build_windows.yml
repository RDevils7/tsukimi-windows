name: Windows
on:
  workflow_call:

jobs:
  build:
    name: Build (x86_64)

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-nsis
            zip

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          cache: false

      - name: Verify blueprint toolchain
        run: |
          pacman -Q mingw-w64-ucrt-x86_64-blueprint-compiler
          python -c "from blueprintcompiler.main import main; print('blueprintcompiler module OK')"
          # blueprint-compiler must be able to load the GTK typelibs; run one
          # real compile of every .blp file before cargo needs it. Invoking it
          # through bash exercises the shebang script the way a user would,
          # which crates/mutsumi/build.rs works around on Windows (the MSYS2
          # package ships an extensionless script that CreateProcess cannot
          # execute directly).
          bash -c 'exec blueprint-compiler batch-compile /tmp/bc-verify crates/mutsumi/resources/blueprints crates/mutsumi/resources/blueprints/*.blp'
          ls /tmp/bc-verify

      - name: Build tsukimi
        env:
          DANDANAPI_SECRET_KEY: ${{ secrets.DANDANAPI_SECRET_KEY }}
          RUSTFLAGS: -L native=/ucrt64/lib
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Package
        run: bash build-aux/windows/package.sh x86_64-pc-windows-gnu dist

      - name: Build installer
        run: |
          VERSION="$(grep -m1 '^version' crates/tsukimi/Cargo.toml | cut -d '"' -f 2)"
          makensis "-DAPP_VERSION=$VERSION" installer/tsukimi.nsi
          mv tsukimi-x86_64-windows-setup.exe dist/

      # upload-artifact with archive: false only accepts a single file, so
      # the portable bundle and the installer are uploaded as two artifacts.
      - name: Upload portable bundle
        uses: actions/upload-artifact@v7
        with:
          name: tsukimi-x86_64-windows
          path: dist/tsukimi-x86_64-windows.zip
          archive: false

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: tsukimi-x86_64-windows-setup
          path: dist/tsukimi-x86_64-windows-setup.exe
          archive: false
